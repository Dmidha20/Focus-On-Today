<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus On Today</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="main">
        <h1 class="title">Focus On <span class="title-span">Today</span></h1>
        <div class="card">
            <div class="header">
                <h1>Today ☀️</h1>

            </div>
            <div>
                <p class="progress-info">Raise the bar by completing your goals!</p>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
                <span class="progress-text">0/3 completed</span>
            </div>

            <div class="goals">
                <p class="error-label"></p>
                <div class="goal">
                    <div class="checkbox">
                        <span class="check-icon">✓</span>
                    </div>
                    <input type="text" placeholder="Add new goal..." />
                </div>
                <div class="goal">
                    <div class="checkbox">
                        <span class="check-icon">✓</span>
                    </div>
                    <input type="text" placeholder="Add new goal..." />
                </div>
                <div class="goal">
                    <div class="checkbox">
                        <span class="check-icon">✓</span>
                    </div>
                    <input type="text" placeholder="Add new goal..." />
                </div>
            </div>


            <div class="quote">
                <p>“Move one step ahead, today!”</p>
            </div>
            <div class="footer">
                <p>Made with ❤️ by Dhriti Midha </p>

            </div>
        </div>

    </div>

</body>

</html>
